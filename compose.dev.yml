# Stack de DESENVOLVIMENTO LOCAL - apenas PostgreSQL.
#
# Uso:
#   docker compose -f compose.dev.yml up -d
#   docker compose -f compose.dev.yml down        (preserva os dados)
#
# Este arquivo NAO substitui o compose.yml (producao). Ele apenas sobe um
# PostgreSQL isolado, com volume e credenciais proprias, para a API rodar
# direto do venv na maquina de desenvolvimento.
#
# As variaveis vem do arquivo .env da raiz (nao versionado).

services:
  db:
    image: postgres:18-alpine
    container_name: sb-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18+: o volume deve ser montado em /var/lib/postgresql
      - sb-postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sb-postgres-dev-data:
