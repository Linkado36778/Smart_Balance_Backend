# Site Nginx do Smart Balance (somente este arquivo; nao altera nginx.conf).
# Instalado em /etc/nginx/sites-available/smart-balance.conf com __DOMAIN__
# substituido pelo dominio real. O certbot (--nginx) acrescenta o bloco 443
# e o redirecionamento HTTP->HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Fotos da balanca/app para reconhecimento e upload de imagens.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A primeira inferencia SigLIP carrega o modelo (dezenas de segundos).
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }
}
